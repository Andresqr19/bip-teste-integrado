name: CI - Fullstack Integrado

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: bip_db
          POSTGRES_USER: bip
          POSTGRES_PASSWORD: bip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bip -d bip_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        volumes:
          - /var/lib/postgresql/data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build EJB Module
        run: |
          cd ejb-module
          mvn clean install -DskipTests
          cd ..

      - name: Build Backend (Spring Boot)
        run: |
          cd backend-module
          mvn clean verify -DskipTests
          cd ..

      - name: Setup Node.js (for Angular)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend (Angular)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build --if-present

      - name: Build Docker Infrastructure
        working-directory: ./infra
        run: |
          docker compose build
          docker compose up -d db wildfly

      - name: Deploy EJB to WildFly
        run: |
          sleep 30
          docker cp ejb-module/target/ejb-module-1.0.0-SNAPSHOT.jar bip-wildfly:/opt/jboss/wildfly/standalone/deployments/
          docker exec bip-wildfly ls /opt/jboss/wildfly/standalone/deployments/
          docker exec -it bip-wildfly /opt/jboss/wildfly/bin/add-user.sh -a -u admin -p "Admin#123" --silent

      - name: Run Backend Integration Tests
        run: |
          cd backend-module
          mvn test
          cd ..

      - name: Logs Summary
        if: always()
        run: |
          echo "=== Containers Ativos ==="
          docker ps
          echo "=== Logs do WildFly ==="
          docker logs bip-wildfly | tail -n 50

  frontend-deploy:
    name: Build Frontend Dist
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Angular
        working-directory: ./frontend
        run: |
          npm ci
          npm run build --if-present
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
