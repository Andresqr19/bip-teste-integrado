<mat-sidenav-container class="shell">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-toolbar class="brand" color="primary">BIP</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
        <mat-icon>list</mat-icon>
        <span>Benefícios</span>
      </a>
      <a mat-list-item routerLink="novo" routerLinkActive="active">
        <mat-icon>add</mat-icon>
        <span>Criar Benefício</span>
      </a>
      <a mat-list-item routerLink="transfer" routerLinkActive="active">
        <mat-icon>swap_horiz</mat-icon>
        <span>Transferência</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      <button mat-icon-button (click)="sidenav.toggle()" class="hide-desktop">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">Sistema BIP Benefícios</span>
      <span class="spacer"></span>
      <button mat-icon-button aria-label="help"><mat-icon>help_outline</mat-icon></button>
    </mat-toolbar>

    <div class="page">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
